<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>HTTPer</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F5FF;--surface:#fff;--soft:#F1EFFB;--line:#E7E3F7;--text:#241B3A;--muted:#71678F;--dim:#9E96BE;--blue:#3E8EFF;--blue-soft:#E7F0FF;--green:#28C285;--red:#FF6157;--radius:14px;--radius-lg:22px}*{box-sizing:border-box;margin:0;padding:0}body{min-height:100vh;background:var(--bg);color:var(--text);font-family:Inter,sans-serif;line-height:1.55}a{text-decoration:none;color:inherit}button,input,select,textarea{font:inherit}button{cursor:pointer}#app{max-width:1120px;margin:auto;padding:28px 28px 80px}.hero{background:var(--blue-soft);border-radius:var(--radius-lg);padding:27px 26px}.hero h1{font:600 30px Fredoka,sans-serif;color:var(--blue)}.hero p{margin-top:8px;color:var(--muted);max-width:760px}.panel{margin-top:16px;background:#fff;border:2px solid var(--line);border-radius:var(--radius-lg);padding:24px}.panel-title{font:600 19px Fredoka,sans-serif;margin-bottom:18px}.request-line{display:grid;grid-template-columns:140px 1fr auto;gap:10px}.input,.select,.textarea{width:100%;border:2px solid var(--line);border-radius:var(--radius);background:var(--soft);color:var(--text);padding:12px 13px}.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--blue)}.btn{border:2px solid var(--line);background:#fff;padding:10px 15px;border-radius:999px;font-weight:500}.btn:hover{border-color:var(--blue);background:var(--blue-soft)}.btn-primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn-danger{color:var(--red);border-color:transparent;background:transparent}.header-list{display:flex;flex-direction:column;gap:9px}.header-row{display:grid;grid-template-columns:minmax(150px,.45fr) minmax(280px,1.6fr) auto;gap:9px}.subhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:20px 0 10px}.subhead strong{font-size:14px}.hint{font-size:12px;color:var(--muted)}.option-row{display:flex;align-items:flex-start;gap:9px;margin-top:14px;padding:11px 13px;background:var(--soft);border:1px solid var(--line);border-radius:var(--radius);font-size:13px}.option-row input{margin-top:3px}.option-row span{display:block}.option-row small{display:block;color:var(--muted);margin-top:2px}.textarea{min-height:130px;resize:vertical;font-family:'IBM Plex Mono',monospace;font-size:13px}.hidden{display:none!important}.msg{margin-top:12px;font-size:13px;color:var(--red)}.statusbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.pill{border-radius:999px;background:var(--soft);padding:7px 11px;font:500 12px 'IBM Plex Mono',monospace}.pill.ok{background:#E4FAF0;color:#187C59}.pill.warn{background:#FFF3DC;color:#9A6500}.table{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}.row{display:grid;grid-template-columns:230px 1fr;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.cell{padding:10px 12px;font-size:12.5px;word-break:break-word}.cell:first-child{background:var(--soft);font-family:'IBM Plex Mono',monospace;color:#5B62F4}.bodybox{margin-top:14px}.body-actions{display:flex;gap:9px;flex-wrap:wrap}.bodybox pre{white-space:pre-wrap;word-break:break-word;background:#201A32;color:#F4F0FF;border-radius:var(--radius);padding:16px;max-height:560px;overflow:auto;font:12.5px/1.5 'IBM Plex Mono',monospace}.preview-frame{width:100%;height:620px;border:2px solid var(--line);border-radius:var(--radius);background:#fff}.network-wrap{margin-top:12px;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}.network-head,.network-item{display:grid;grid-template-columns:88px minmax(0,1fr) 125px;gap:10px;align-items:center}.network-head{padding:9px 12px;background:var(--soft);font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}.network-item{padding:10px 12px;border-top:1px solid var(--line)}.network-type{font:500 11px 'IBM Plex Mono',monospace;color:#5B62F4;text-transform:uppercase}.network-url{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:12px 'IBM Plex Mono',monospace}.network-empty{padding:16px;color:var(--muted);font-size:13px}.network-send{justify-self:end;padding:7px 11px;font-size:12px}.loading{opacity:.6;pointer-events:none}@media(max-width:760px){.request-line,.header-row,.row{grid-template-columns:1fr}.cell:first-child{border-bottom:1px solid var(--line)}.preview-frame{height:480px}.network-head{display:none}.network-item{grid-template-columns:1fr}.network-url{white-space:normal;overflow-wrap:anywhere}.network-send{justify-self:start}}
</style></head><body><div id="app">
<section class="hero"><h1>HTTPer</h1><p>Send HTTP requests and inspect response headers and body.</p></section>
<section class="panel" id="requestPanel"><div class="panel-title">Request</div><div class="request-line"><select class="select" id="method"><option>GET</option><option>POST</option><option>PUT</option><option>PATCH</option><option>DELETE</option><option>HEAD</option><option>OPTIONS</option></select><input class="input" id="url" placeholder="https://example.com"><button class="btn btn-primary" id="send">Send request</button></div><label class="option-row"><input type="checkbox" id="reuseResponseHeaders"><span><strong>Use previous response headers for next request</strong><small>After a response, reusable headers are merged into the request headers. Set-Cookie is converted to Cookie.</small></span></label><div class="subhead"><div><strong>Headers</strong><div class="hint">Host follows the request URL by default. Edit it to override.</div></div><button class="btn" id="addHeaderBtn">+ Add header</button></div><div class="header-list" id="headers"></div><div id="bodyWrap" class="hidden"><div class="subhead"><strong>Request body</strong><span class="hint">Sent as entered</span></div><textarea class="textarea" id="requestBody" placeholder='{"hello":"world"}'></textarea></div><div class="msg" id="message"></div></section>
<section class="panel hidden" id="responsePanel"><div class="panel-title">Response</div><div class="statusbar" id="statusbar"></div><div class="subhead"><strong>Response headers</strong></div><div class="table" id="responseHeaders"></div><div class="bodybox"><div class="body-actions"><button class="btn" id="toggleBody">Show body</button><button class="btn hidden" id="togglePreview">Preview body</button><button class="btn hidden" id="toggleNetwork">Network View</button></div><div id="bodyContent" class="hidden" style="margin-top:12px"><pre id="responseBody"></pre></div><div id="previewContent" class="hidden" style="margin-top:12px"><iframe id="previewFrame" class="preview-frame" sandbox="allow-scripts allow-forms allow-popups allow-popups-to-escape-sandbox" referrerpolicy="no-referrer"></iframe></div><div id="networkContent" class="hidden network-wrap"><div class="network-head"><div>Type</div><div>Request URL</div><div></div></div><div id="networkList"></div></div></div></section></div>
<script src="httper.js"></script>
<script src="network-filter.js"></script>
</body></html>
