<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>HTTPer</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1117;--surface:#161b27;--surface2:#1e2535;--border:#2a3347;--accent:#4f9cf9;--text:#e2e8f0;--muted:#94a3b8;--danger:#f87171;--radius:8px}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',sans-serif;min-height:100vh}.wrap{max-width:1100px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.title{font:600 26px 'IBM Plex Mono',monospace}.sub{color:var(--muted);font-size:13px}.panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;margin-top:14px}.request{display:grid;grid-template-columns:120px 1fr auto;gap:10px}.input,.select,.textarea{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:var(--radius);padding:10px}.textarea{min-height:130px;font-family:'IBM Plex Mono',monospace}.btn{background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:10px 14px;cursor:pointer}.btn:hover{border-color:var(--accent);color:var(--accent)}.btn.primary{background:rgba(79,156,249,.15);color:var(--accent)}.header-row{display:grid;grid-template-columns:minmax(160px,.5fr) 1.5fr auto;gap:8px;margin-top:8px}.section-head{display:flex;align-items:center;justify-content:space-between;margin-top:18px;margin-bottom:8px}.hint{font-size:12px;color:var(--muted)}.hidden{display:none}.status{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.pill{font:500 12px 'IBM Plex Mono',monospace;background:var(--surface2);padding:6px 9px;border-radius:999px}.headers{border:1px solid var(--border);border-radius:8px;overflow:hidden}.hrow{display:grid;grid-template-columns:220px 1fr;border-top:1px solid var(--border)}.hrow:first-child{border-top:0}.hrow div{padding:9px 11px;font-size:12px;word-break:break-word}.hrow div:first-child{color:var(--accent);font-family:'IBM Plex Mono',monospace}.body{margin-top:12px;background:#0a0d12;border:1px solid var(--border);border-radius:8px;padding:14px;white-space:pre-wrap;word-break:break-word;max-height:60vh;overflow:auto;font:12px/1.5 'IBM Plex Mono',monospace}.msg{margin-top:10px;color:var(--danger);font-size:12px}@media(max-width:700px){.request,.header-row,.hrow{grid-template-columns:1fr}}
</style>
</head><body><div class="wrap"><div class="top"><div><div class="title">HTTPer</div><div class="sub">Send HTTP requests and inspect response headers/body.</div></div></div><div class="panel"><div class="request"><select id="method" class="select"><option>GET</option><option>POST</option><option>PUT</option><option>PATCH</option><option>DELETE</option><option>HEAD</option><option>OPTIONS</option></select><input id="url" class="input" placeholder="https://example.com"><button id="send" class="btn primary">Send request</button></div><div class="section-head"><strong>Headers</strong><button id="addHeader" class="btn">+ Add header</button></div><div id="headers"></div><div id="bodyWrap" class="hidden"><div class="section-head"><strong>Request body</strong></div><textarea id="requestBody" class="textarea" placeholder='{"hello":"world"}'></textarea></div><div id="message" class="msg"></div></div><div id="responsePanel" class="panel hidden"><div class="status" id="status"></div><div class="section-head"><strong>Response headers</strong></div><div id="responseHeaders" class="headers"></div><div class="section-head"><strong>Response body</strong></div><pre id="responseBody" class="body"></pre></div></div><script src="httper.js"></script></body></html>
