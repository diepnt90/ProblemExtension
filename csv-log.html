<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>CSV/Json Log Reader</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet"><style>:root{--bg:#0e1117;--surface:#161b27;--surface2:#1e2535;--border:#2a3347;--accent:#34d399;--text:#e2e8f0;--muted:#94a3b8;--radius:8px}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',sans-serif;min-height:100vh}.wrap{max-width:1400px;margin:auto;padding:28px}.title{font:600 26px 'IBM Plex Mono',monospace}.sub{color:var(--muted);font-size:13px;margin-top:4px}.panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;margin-top:14px}.input,.select{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:var(--radius);padding:10px}.btn{background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:10px 14px;cursor:pointer}.btn:hover{border-color:var(--accent);color:var(--accent)}.file-row,.controls,.filter-row,.result-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.file-row{margin-top:12px}.file-row .input{flex:1;min-width:260px}.meta{font-size:12px;color:var(--muted);margin-top:8px}.filters{display:flex;flex-direction:column;gap:8px}.filter-row{display:grid;grid-template-columns:minmax(160px,1fr) 110px minmax(180px,1.5fr) auto}.table-wrap{overflow:auto;max-height:70vh;border:1px solid var(--border);border-radius:8px;margin-top:12px}table{border-collapse:collapse;width:max-content;min-width:100%;font-size:12px}th,td{padding:8px 10px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);white-space:nowrap}th{position:sticky;top:0;background:var(--surface2);text-align:left}.column-list{display:flex;gap:8px 14px;flex-wrap:wrap;margin-top:10px}.column-list label{font-size:12px;color:var(--muted)}.text-log{margin-top:12px;background:#fff;color:#111;border-radius:8px;padding:14px;max-height:70vh;overflow:auto;white-space:pre;font:12px/1.5 'IBM Plex Mono',monospace}.hidden{display:none}@media(max-width:760px){.filter-row{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="title">CSV/Json Log Reader</div><div class="sub">Open CSV/JSON logs, filter fields and inspect application logs locally in the browser.</div><div class="panel"><input id="file" type="file" accept=".csv,.json,.jsonl,.ndjson,text/csv,application/json,application/x-ndjson"><div class="file-row"><input id="fileUrl" class="input" type="url" placeholder="https://example.com/logs/file.json"><button id="loadUrl" class="btn">Load URL</button></div><div id="urlMsg" class="meta"></div><div class="controls" style="margin-top:12px"><label>Rows <input id="limit" class="input" type="number" min="1" value="100" style="width:90px"></label><button id="showAll" class="btn">Show all</button><button id="clear" class="btn">Clear</button></div><div id="stats" class="meta"></div></div><div id="filterPanel" class="panel hidden"><strong>Filters</strong><div id="filters" class="filters" style="margin-top:10px"></div><div class="controls" style="margin-top:10px"><button id="addFilter" class="btn">+ Add filter</button><button id="clearFilters" class="btn">Clear filters</button></div></div><div id="resultPanel" class="panel hidden"><div class="result-head"><strong>Results</strong><button id="exportCsv" class="btn">Export filtered CSV</button></div><div class="controls" style="margin-top:10px"><button id="selectAllColumns" class="btn">Select all</button><button id="deselectAllColumns" class="btn">Deselect all</button></div><div id="columnList" class="column-list"></div><div id="resultInfo" class="meta"></div><div id="table"></div></div></div><script src="csv-log.js"></script></body></html>
